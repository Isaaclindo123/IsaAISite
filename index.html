<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IsaAI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #2a2a2a;
            background-color: #1e1e1e;
        }

        header h1 {
            font-size: 1.5rem;
            color: #ffffff;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user {
            align-self: flex-end;
            background-color: #2b5278;
            color: #ffffff;
        }

        .bot {
            align-self: flex-start;
            background-color: #2a2a2a;
            color: #e0e0e0;
            border: 1px solid #333;
        }

        #input-container {
            display: flex;
            padding: 15px;
            background-color: #1e1e1e;
            border-top: 1px solid #2a2a2a;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background-color: #121212;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: #2b5278;
        }

        button {
            padding: 12px 20px;
            background-color: #2b5278;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #3b6288;
        }
    </style>
</head>
<body>

    <header>
        <h1>IsaAI</h1>
    </header>

    <div id="chat-container"></div>

    <div id="input-container">
        <input type="text" id="userInput" placeholder="Digite sua mensagem..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Enviar</button>
    </div>

    <script>
        let historico = [
            { role: "system", content: "Responda sempre em português do Brasil de forma direta e objetiva." }
        ];

        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const chatContainer = document.getElementById("chat-container");
            const text = inputField.value.trim();

            if (!text) return;

            appendMessage(text, "user");
            inputField.value = "";

            historico.push({ role: "user", content: text });

            const loadingDiv = appendMessage("Pensando...", "bot");

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        messages: historico
                    })
                });

                const data = await response.json();
                
                if (data.choices && data.choices[0]) {
                    const botReply = data.choices[0].message.content;
                    loadingDiv.textContent = botReply;
                    historico.push({ role: "assistant", content: botReply });
                } else {
                    loadingDiv.textContent = "Ops! Erro ao obter resposta da IA.";
                }

            } catch (error) {
                console.error(error);
                loadingDiv.textContent = "Erro na conexão com o servidor.";
            }
        }

        function appendMessage(text, sender) {
            const chatContainer = document.getElementById("chat-container");
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message", sender);
            msgDiv.textContent = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }
    </script>
</body>
</html>
